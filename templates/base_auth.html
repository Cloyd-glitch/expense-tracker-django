{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FinTrack{% endblock %} — FinTrack</title>
  <meta name="description" content="{% block meta_description %}Personal finance and expense tracker.{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'expenses/style.css' %}" />
</head>
<body>

<div class="auth-wrapper">
  {% if messages %}
  <div class="messages-container" style="position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:999;min-width:320px">
    {% for msg in messages %}
    <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
